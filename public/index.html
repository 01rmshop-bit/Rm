<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชทสั่งงาน — BWL Store Auto</title>
<link rel="stylesheet" href="/styles.css">
<style>
  #app-shell { height: 100vh; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chatheader { padding: 16px 28px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .chatheader .t { font-size: 14.5px; font-weight: 700; }
  .chatheader .s { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  #messages { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 14px; }
  .bubble { max-width: 70%; padding: 11px 15px; border-radius: 14px; font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
  .bubble.user { align-self: flex-end; background: var(--brand); color: #fff; border-radius: 14px 14px 2px 14px; }
  .bubble.assistant { align-self: flex-start; background: #fff; border: 1px solid var(--border); border-radius: 14px 14px 14px 2px; }
  .bubble.error { align-self: flex-start; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--danger-text); border-radius: 14px 14px 14px 2px; }
  .bubble.pending { align-self: flex-start; color: var(--text-faint); font-style: italic; }
  .quickrow { display: flex; gap: 8px; padding: 0 28px 12px 28px; flex-wrap: wrap; }
  .quickchip {
    font-size: 12px; padding: 7px 12px; background: var(--chip-bg); border-radius: 999px; color: #3F3F46;
    cursor: pointer; border: none; font-family: inherit;
  }
  .quickchip:hover { background: var(--border); }
  .inputbar { padding: 0 28px 24px 28px; background: var(--surface); }
  .inputrow { display: flex; gap: 10px; background: var(--chip-bg); border-radius: 12px; padding: 6px 6px 6px 16px; align-items: center; }
  .inputrow input { flex: 1; border: none; background: transparent; font-size: 13.5px; outline: none; font-family: inherit; }
  .sendbtn { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .sendbtn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div id="app-shell">
  <div id="sidebar-root"></div>
  <div class="chat-main">
    <div class="chatheader">
      <div class="t">พิมพ์สั่งงานร้านของคุณ</div>
      <div class="s">เช็คสต็อก เช็คออเดอร์ หรือขอปรับราคาสินค้าได้เลย ระบบจะถามยืนยันก่อนบันทึกทุกครั้ง</div>
    </div>
    <div id="messages"></div>
    <div class="quickrow">
      <button class="quickchip" data-msg="เช็คออเดอร์ล่าสุด 10 รายการ">เช็คออเดอร์ล่าสุด</button>
      <button class="quickchip" data-msg="สินค้าตัวไหนใกล้หมดสต็อกบ้าง">สินค้าใกล้หมดสต็อก</button>
      <button class="quickchip" data-msg="ช่วยหาสินค้าทั้งหมดในร้านให้หน่อย">ดูสินค้าทั้งหมด</button>
    </div>
    <div class="inputbar">
      <div class="inputrow">
        <input id="msgInput" type="text" placeholder='พิมพ์คำสั่ง เช่น "เช็คออเดอร์วันนี้"...' autofocus>
        <button class="sendbtn" id="sendBtn" aria-label="ส่ง">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
  renderSidebar('chat');

  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');

  function addBubble(role, text) {
    const el = document.createElement('div');
    el.className = 'bubble ' + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  addBubble('assistant', 'สวัสดีครับ พิมพ์สั่งงานร้าน Black White Lifestyle ได้เลย เช่น "เช็คสต็อกที่ใกล้หมด" หรือ "ปรับราคาเสื้อ Oversize สีดำ ไซส์ L ลง 10%"');

  let sending = false;

  async function sendMessage(text) {
    if (!text || sending) return;
    sending = true;
    sendBtn.disabled = true;
    addBubble('user', text);
    const pending = addBubble('pending', 'กำลังพิมพ์...');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      pending.remove();
      if (res.ok) {
        addBubble('assistant', data.reply);
      } else if (res.status === 401) {
        window.location.href = '/login';
      } else {
        addBubble('error', 'เกิดข้อผิดพลาด: ' + (data.error || 'ไม่ทราบสาเหตุ'));
      }
    } catch (err) {
      pending.remove();
      addBubble('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองใหม่อีกครั้ง');
    } finally {
      sending = false;
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    input.value = '';
    sendMessage(text);
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const text = input.value.trim();
      input.value = '';
      sendMessage(text);
    }
  });
  document.querySelectorAll('.quickchip').forEach((btn) => {
    btn.addEventListener('click', () => sendMessage(btn.dataset.msg));
  });
</script>
</body>
</html>
